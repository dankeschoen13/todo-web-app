{% extends "base.html" %}

{% block title %}
    {{ super() }} | Login
{% endblock %}

{% block content %}
<div class="flex items-center justify-center transition-colors duration-300">

    <div class="min-w-md w-full space-y-8 bg-white dark:bg-slate-800 p-10 rounded-xl shadow-sm border border-slate-100 dark:border-slate-700/50">

        <!-- Header -->
        <div>
            <h2 class="mt-2 text-center text-3xl font-extrabold text-slate-900 dark:text-white">
                Login to your account
            </h2>
            <p class="mt-2 text-center text-sm text-slate-500 dark:text-slate-400">
                Or
                <a href="#" class="font-medium text-blue-600 hover:text-blue-500 dark:text-blue-400 transition-colors">
                    sign up for an account
                </a>
            </p>
        </div>

        <!-- HTLM Form -->
        <form id="login-form" class="mt-8 space-y-6">
            <div class="space-y-4">

                <!-- Identifier Field (Email or Username) -->
                <div>
                    <label for="identifier" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Username or email address</label>
                    <input type="text" id="identifier" name="identifier" placeholder="johndoe or you@example.com" required
                        class="appearance-none block w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white transition-colors">
                    <p id="error-identifier" class="hidden mt-1 text-sm text-red-600 dark:text-red-400"></p>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300 mb-1">Password</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required minlength="8"
                        class="appearance-none block w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-md shadow-sm placeholder-slate-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm bg-white dark:bg-slate-700 text-slate-900 dark:text-white transition-colors">
                    <p id="error-password" class="hidden mt-1 text-sm text-red-600 dark:text-red-400"></p>
                </div>

            </div>

            <!-- Global Error Message (For unified auth errors or server crashes) -->
            <div id="error-global" class="hidden p-3 bg-red-100 dark:bg-red-900/30 border border-red-200 dark:border-red-800 rounded-md text-sm text-red-600 dark:text-red-400 text-center"></div>

            <!-- Submit Button -->
            <div>
                <button type="submit" id="submit-btn" class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 dark:focus:ring-offset-slate-800 transition-colors cursor-pointer">
                    Log In
                </button>
            </div>
        </form>

    </div>
</div>
{% endblock %}

{% block scripts %}
    {{ super() }}
    <script type="module" src="{{ url_for('static', filename='js/login.js') }}"></script>
{% endblock %}
